# FleetPulse - fp.qaam.work
#
# There is deliberately no TLS here. Cloudflare terminates HTTPS at the edge and
# cloudflared delivers plain HTTP to this port, so a certificate in this file
# would be a second, pointless hop. The tunnel should be the only thing that can
# reach the published port - everything below trusts it on that basis.
#
# One origin serves everything:
#   /api/     -> Django    (REST API)
#   /admin/   -> Django    (Django admin)
#   /static/  -> Django    (WhiteNoise, includes the admin's own assets)
#   /         -> Next.js   (the dashboard, including /_next/*)

# Keep the scheme the tunnel reported. Django reads it back through
# SECURE_PROXY_SSL_HEADER, which is what makes admin redirects and CSRF checks
# use https:// instead of downgrading to http:// and being bounced by Cloudflare.
map $http_x_forwarded_proto $fp_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name fp.qaam.work _;

    # Docker's embedded DNS. Resolving the upstreams per request instead of once
    # at start-up is what keeps this container working after
    # `docker compose up -d --build` hands backend and frontend new addresses -
    # with a static upstream block nginx would cache the dead IPs and 502 until
    # someone restarted it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fp_api http://backend:8000;
    set $fp_web http://frontend:3000;

    # Spreadsheet uploads. The API caps files at 10 MB (MAX_IMPORT_FILE_BYTES);
    # the headroom lets an oversized file reach Django and come back with a
    # readable message instead of a bare nginx 413.
    client_max_body_size 25m;
    client_body_timeout 120s;

    # cloudflared passes the visitor's address in CF-Connecting-IP. Depending on
    # whether it runs on this host or another box, and on whether Docker uses
    # the userland proxy, the connection arrives from loopback, the bridge
    # gateway or the LAN - so all three are trusted. The real boundary is the
    # published port itself: nothing but the tunnel should be able to reach it.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # The nginx image links these to the container's stdout/stderr, which is
    # what puts them in `docker compose logs -f nginx`.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript
               application/xml image/svg+xml;

    # Set once here; every location below inherits them because none of them
    # declares a proxy_set_header of its own.
    proxy_http_version 1.1;
    # $http_host, not $host: it keeps the port. Without it a direct visit to
    # http://<host>:8090 reaches Django as bare <host>, and the admin's own
    # CSRF check then disagrees with the browser's Origin and returns 403.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fp_scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Connection        "";
    proxy_redirect off;

    # Reports and exports can take a while to assemble on a large date range.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # Answered by nginx itself, so its container healthcheck reports on nginx
    # and not on whatever is behind it.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $fp_api$request_uri;
        # CSV and XLSX exports stream; buffering them would hold the whole file
        # in nginx before the browser sees a single byte.
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass $fp_api$request_uri;
    }

    location /static/ {
        # WhiteNoise sends its own long-lived Cache-Control for the hashed
        # filenames it serves, so nothing is added here - a second header would
        # only give the browser two answers to the same question.
        proxy_pass $fp_api$request_uri;
    }

    # Next's build output is content-hashed and already carries immutable cache
    # headers; this block only keeps gzip off already-compressed assets.
    location /_next/static/ {
        proxy_pass $fp_web$request_uri;
        gzip off;
    }

    location / {
        proxy_pass $fp_web$request_uri;
    }
}
